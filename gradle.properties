# Sized for the 2 core / 7 GB runner that GitHub gives PRIVATE repositories, which is
# what README section 1 tells you to create. The Kotlin compile daemon is a separate
# JVM, so the two heaps plus the OS have to fit in 7 GB. Overcommitting here surfaces
# as "Gradle build daemon disappeared unexpectedly", not as a clean out-of-memory.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official
