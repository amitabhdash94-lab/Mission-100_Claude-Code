name: Bootstrap Keystore

# RUN THIS ONCE, EVER.
#
# Actions tab > Bootstrap Keystore > Run workflow.
# It creates the permanent NEUROFIT signing key, base64 encodes it, and uploads
# both the key and the generated passwords as a build artifact.
#
# If you ever regenerate this key, Android will refuse to install the new build
# over the installed app and you will lose all local data. Generate once, save
# the artifact somewhere safe, never run this again.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        required: true
        default: "neurofit"
      validity_years:
        description: "Validity in years (1-100)"
        required: true
        default: "50"
      common_name:
        description: "Certificate common name (cosmetic, sideload only)"
        required: true
        default: "NEUROFIT"

# This workflow only produces an artifact. It never needs to touch the repo.
permissions:
  contents: read

jobs:
  keystore:
    name: Generate signing keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        env:
          ALIAS: ${{ inputs.alias }}
          VALIDITY_YEARS: ${{ inputs.validity_years }}
          COMMON_NAME: ${{ inputs.common_name }}
        run: |
          set -euo pipefail
          mkdir -p out

          # Inputs reach the shell as environment variables, never interpolated
          # into the script body, so they cannot inject commands. Validate anyway.
          case "$VALIDITY_YEARS" in
            ''|*[!0-9]*) echo "::error title=Bad input::validity_years must be a whole number."; exit 1 ;;
          esac
          if [ "$VALIDITY_YEARS" -lt 1 ] || [ "$VALIDITY_YEARS" -gt 100 ]; then
            echo "::error title=Bad input::validity_years must be between 1 and 100."
            exit 1
          fi
          case "$ALIAS" in
            ''|*[!A-Za-z0-9_-]*) echo "::error title=Bad input::alias must be letters, digits, underscore or hyphen."; exit 1 ;;
          esac
          DAYS=$(( VALIDITY_YEARS * 365 ))

          # No pipeline here on purpose: a 'rand | tr | head' chain can be killed by
          # SIGPIPE under 'set -o pipefail'. 24 random bytes as hex is 48 characters
          # and 192 bits of entropy, and is safe to paste into a GitHub secret.
          STORE_PASS="$(openssl rand -hex 24)"
          if [ "${#STORE_PASS}" -ne 48 ]; then
            echo "::error title=RNG::Password generation failed."
            exit 1
          fi
          # Redact it from this job's log no matter what echoes it later.
          echo "::add-mask::$STORE_PASS"
          # PKCS12 requires the store password and the key password to be the same.
          KEY_PASS="$STORE_PASS"

          keytool -genkeypair -v \
            -keystore out/release.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity "$DAYS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=${COMMON_NAME}, OU=Personal, O=Personal, L=NA, ST=NA, C=IN"

          # Prove the key is usable before anyone builds on top of it.
          if [ ! -s out/release.jks ]; then
            echo "::error title=No keystore::keytool produced no keystore."
            exit 1
          fi
          keytool -list -keystore out/release.jks -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null
          echo "Keystore generated and verified readable."

          base64 -w0 out/release.jks > out/release.jks.base64

          {
            echo "NEUROFIT signing secrets. Store this file somewhere safe and offline."
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "Create these four repository secrets:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "1. KEYSTORE_BASE64      = the entire contents of release.jks.base64 (one long line)"
            echo "2. KEYSTORE_PASSWORD    = ${STORE_PASS}"
            echo "3. KEY_ALIAS            = ${ALIAS}"
            echo "4. KEY_PASSWORD         = ${KEY_PASS}"
            echo ""
            echo "All four must be set. Setting only some of them makes the build fail"
            echo "on purpose, rather than quietly producing a debug signed APK."
            echo ""
            echo "SHA-256 fingerprint:"
            keytool -list -v -keystore out/release.jks -storepass "$STORE_PASS" 2>/dev/null \
              | grep -i 'SHA256:' || true
          } > out/SECRETS.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: neurofit-keystore
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Instructions
        run: |
          {
            echo "## Signing key created"
            echo ""
            echo "Download the **neurofit-keystore** artifact from this run. It expires in 7 days."
            echo "It contains three files:"
            echo ""
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`release.jks\` | the actual signing key, back this up offline |"
            echo "| \`release.jks.base64\` | the value for the KEYSTORE_BASE64 secret |"
            echo "| \`SECRETS.txt\` | the generated passwords and the alias |"
            echo ""
            echo "### Now create four repository secrets"
            echo ""
            echo "Go to **Settings > Secrets and variables > Actions > New repository secret** and add:"
            echo ""
            echo "1. \`KEYSTORE_BASE64\` paste the entire contents of \`release.jks.base64\`"
            echo "2. \`KEYSTORE_PASSWORD\` from \`SECRETS.txt\`"
            echo "3. \`KEY_ALIAS\` from \`SECRETS.txt\`"
            echo "4. \`KEY_PASSWORD\` from \`SECRETS.txt\`"
            echo ""
            echo "Set all four or none. A partial set fails the build deliberately."
            echo ""
            echo "Then run the **Build APK** workflow. Never run this bootstrap workflow again."
            echo ""
            echo "> The passwords are deliberately not printed here. They are inside the artifact only."
          } >> "$GITHUB_STEP_SUMMARY"
